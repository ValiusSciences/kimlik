[build-system]
requires = ["hatchling>=1.27"]  # >=1.27 for PEP 639 license expressions
build-backend = "hatchling.build"

[project]
# Distribution name is vendor-prefixed to match the other Valius packages;
# the import name and CLI stay `kimlik`.
name = "valius-kimlik"
# Single source of truth is __version__ in src/kimlik/__init__.py; hatch reads
# it at build time (see [tool.hatch.version]). Bump it there, not here.
dynamic = ["version"]
description = "Tissue- and diagnosis-specific gene signatures for labeling cell types in single-cell RNA-seq data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bulent Arman Aksoy", email = "arman@valiussciences.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "single-cell",
    "scRNA-seq",
    "cell-type-annotation",
    "gene-signatures",
    "bioinformatics",
    "LLM",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "parallel-web>=0.5.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ValiusSciences/kimlik"
Repository = "https://github.com/ValiusSciences/kimlik"
Issues = "https://github.com/ValiusSciences/kimlik/issues"

[project.scripts]
kimlik = "kimlik.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/kimlik/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kimlik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "W605", # invalid escape sequence — the trap behind the rich-markup fixes
]

[tool.ruff.lint.per-file-ignores]
# typer declares options as argument defaults; that is the framework's idiom.
"src/kimlik/cli.py" = ["B008"]
