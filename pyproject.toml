[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kimlik"
version = "1.0.0"
description = "Tissue- and diagnosis-specific gene signatures for labeling cell types in single-cell RNA-seq data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bulent Arman Aksoy", email = "arman@valiussciences.com" }]
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "parallel-web>=0.5.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
kimlik = "kimlik.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kimlik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "W605", # invalid escape sequence — the trap behind the rich-markup fixes
]

[tool.ruff.lint.per-file-ignores]
# typer declares options as argument defaults; that is the framework's idiom.
"src/kimlik/cli.py" = ["B008"]
